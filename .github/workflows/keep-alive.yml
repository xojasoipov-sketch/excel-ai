name: Keep site awake (09:00-24:00 Tashkent)

# Render's free tier puts the service to sleep after 15 minutes of no traffic;
# the first request after that takes ~10-30s to wake it back up. This workflow
# pings the health endpoint every 10 minutes during business hours so real
# visitors never hit a cold start, and lets it sleep the rest of the time to
# stay within Render's free tier.
#
# Tashkent is UTC+5, so 09:00-24:00 Tashkent = 04:00-19:00 UTC.
on:
  schedule:
    - cron: "*/10 4-19 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 25 https://excelyordamchi-ai.onrender.com/api/health || true
